[package]
name = "ruang-bukti-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
autobins = false

[[bin]]
name = "bukti"
path = "api/bukti.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
aws-credential-types = "1"
aws-sigv4 = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ureq = { version = "3", features = ["json"] }
vercel_runtime = "2"
zeroize = "1"
